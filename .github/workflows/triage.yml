# Triage with any OpenAI-compatible LLM (secrets LLM_BASE_URL, LLM_API_KEY). Posts suggestions; changes nothing.
name: Triage
on:
  workflow_dispatch:
    inputs:
      model: {description: "Model id at your LLM_BASE_URL", default: "gemini-2.5-flash"}
      scope: {description: "Milestone to triage, or 'all'", default: "all"}
permissions: {issues: write, contents: read}
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/triage.py
        env:
          GH_TOKEN: "${{ github.token }}"
          REPO: "${{ github.repository }}"
          MODEL: "${{ inputs.model }}"
          SCOPE: "${{ inputs.scope }}"
          LLM_BASE_URL: "${{ secrets.LLM_BASE_URL }}"
          LLM_API_KEY: "${{ secrets.LLM_API_KEY }}"
